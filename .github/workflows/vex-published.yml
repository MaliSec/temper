# vex-published: rebuild the trust center when vex/ changes on main, so a
# statement applies to every release on the site without waiting for the
# next release.
#
# Actions are pinned to commit SHAs; the comment beside each names the release.
name: vex-published

on:
  push:
    branches:
      - main
    paths:
      - 'vex/**'

permissions: {}

jobs:
  notify-trust:
    runs-on: ubuntu-24.04
    environment: trust-dispatch
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRUST_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.TRUST_DISPATCH_APP_KEY }}
          owner: MaliSec
          repositories: trust
          permission-actions: write
      - name: Rebuild the trust center
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh workflow run trust-center.yml -R MaliSec/trust
