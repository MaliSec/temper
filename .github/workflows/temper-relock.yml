---
# temper-relock: re-resolve the apko lockfiles against Wolfi on a schedule
# and open (or update) one pull request when any package moved.
#
# The PR carries the package diff (scripts/lock-diff.sh). PRs created with
# the workflow token do not trigger other workflows, so this dispatches
# temper-build on the PR branch itself; its checks appear on the PR's head
# commit.
name: temper-relock

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to relock (glob, e.g. node); empty relocks all'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: temper-relock
  cancel-in-progress: false

jobs:
  # The -fips images lock against the @local repo, for both architectures.
  # Relocks branch from main only: from another ref the PR would carry that
  # ref's unmerged commits.
  packages:
    name: Packages (${{ matrix.arch }})
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    env:
      MELANGE_RUNNER: docker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apko and melange
        run: |
          TOOLS="apko melange" ./scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build packages
        run: ./scripts/build.sh --packages --arch "${{ matrix.arch }}"

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relock-packages-${{ matrix.arch }}
          path: packages/${{ matrix.arch }}/*.apk
          if-no-files-found: error
          retention-days: 1

  relock:
    needs: packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # push the relock branch
      pull-requests: write   # open or update the PR
      actions: write         # dispatch temper-build on the branch
    env:
      BRANCH: relock/automated
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apko and melange
        run: |
          TOOLS="apko melange" ./scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download packages (both architectures)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: relock-packages-*
          path: pkg-artifacts

      - name: Index packages
        run: |
          set -euo pipefail
          for a in x86_64 aarch64; do
            mkdir -p "packages/$a"
            cp "pkg-artifacts/relock-packages-$a/"*.apk "packages/$a/"
          done
          ./scripts/build.sh --index

      - name: Relock
        env:
          IMAGE: ${{ inputs.image }}
        run: ./scripts/build.sh --lock ${IMAGE:+--image "$IMAGE"}

      - name: Package diff
        id: diff
        run: |
          set -euo pipefail
          ./scripts/lock-diff.sh > /tmp/lock-diff.md
          cat /tmp/lock-diff.md
          if grep -q '^No package changes' /tmp/lock-diff.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the relock PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bot='github-actions[bot]'
          botmail='41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name "$bot"
          git config user.email "$botmail"
          git checkout -B "$BRANCH"
          git add images/
          git commit -q -m "Relock images against Wolfi ($(date -u +%Y-%m-%d))" \
            -m "Signed-off-by: $bot <$botmail>"
          git push -q --force origin "$BRANCH"

          {
            echo "Scheduled relock: package versions Wolfi now resolves for the committed configs."
            echo
            cat /tmp/lock-diff.md
          } > /tmp/pr-body.md

          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$BRANCH" --body-file /tmp/pr-body.md
          else
            gh pr create --head "$BRANCH" --title "Relock images against Wolfi" --body-file /tmp/pr-body.md
          fi
          gh workflow run temper-build.yml --ref "$BRANCH"
