---
# temper-release-build: the release pipeline. temper-release.yml calls it
# when a date tag (YYYY.MM.DD or YYYY.MM.DD.N) is pushed.
#
# This workflow is the project's signing identity: image signatures, SLSA
# provenance, SBOM attestations and the release manifest all name it, and
# consumers verify against it (docs/verifying.md). A change to this file is a
# change to what consumers trust: review it accordingly.
#
# Layout (SLSA Build Level 3):
#   build    builds, policy-checks, scans and pushes the images. It has no
#            id-token permission, so no build step can sign anything.
#   attest   per image: signs the digest and attests GitHub-generated SLSA v1
#            provenance and the SBOM. It runs no build steps.
#   evidence the gofips provider suites against the shipped provider on
#            both architectures, and the evidence capture (OpenSSL version
#            matrix, FIPS provider parity, benchmark); evidence-bundle packs
#            them, attests the bundle and hands it to the release.
#   release  verifies every image as a consumer would, moves latest to
#            this release if it is the newest, then signs the manifest
#            and creates the GitHub release with the manifest and the
#            evidence bundle.
name: temper-release-build

on:
  workflow_call:

permissions:
  contents: read

env:
  MELANGE_RUNNER: docker
  ARCHS: x86_64,aarch64
  OUT_DIR: dist
  REGISTRY: ghcr.io
  IMAGE_ORG: malisec
  DATE: ${{ github.ref_name }}

jobs:
  # Packages are compiled natively per architecture; the signing key stays
  # on each runner and the build job re-indexes both with its own.
  packages:
    name: Packages (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apko and melange
        run: |
          TOOLS="apko melange" ./scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build packages
        run: ./scripts/build.sh --packages --arch "${{ matrix.arch }}"

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages-${{ matrix.arch }}
          path: packages/${{ matrix.arch }}/*.apk
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build, scan, publish
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push images to ghcr.io
    outputs:
      images: ${{ steps.publish.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The signing identity accepts any date tag, so a release must come
      # from a commit on main.
      - name: Require the tagged commit on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD \
            || { echo "::error::${GITHUB_REF_NAME} is not on main; releases are cut only from main" >&2; exit 1; }

      - name: Install pinned toolchain
        run: |
          TOOLS="apko melange crane grype syft trivy" ./scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v jq >/dev/null || { echo "jq not available on this runner image" >&2; exit 1; }

      - name: Download packages (both architectures)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-packages-*
          path: pkg-artifacts

      # Every image is built for both architectures from the committed
      # lockfiles; apko assembles the arm64 image without running it.
      - name: Build images from the committed lockfiles
        run: |
          set -euo pipefail
          for a in x86_64 aarch64; do
            mkdir -p "packages/$a"
            cp "pkg-artifacts/release-packages-$a/"*.apk "packages/$a/"
          done
          ./scripts/build.sh --index
          ./scripts/build.sh --images --arch "$ARCHS"

      # The provider suites run in these images (both architectures).
      - name: Upload the node and go-builder images for the evidence suites
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-tars
          path: |
            dist/node.tar
            dist/go-builder.tar
          if-no-files-found: error
          retention-days: 7

      # The token goes to docker login over stdin only, never an argv flag.
      - name: Registry login
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login "$REGISTRY" --username "$GH_ACTOR" --password-stdin >/dev/null

      # --download-db-only never scans: it refreshes the cache the cut reads
      # with --skip-db-update. A failed download fails the release before
      # any scan runs (scanning against a stale database is not a pass).
      - name: Refresh scanner DBs (trivy + grype)
        run: |
          set -euo pipefail
          trivy image --download-db-only
          jq -e '.Version' "$HOME/.cache/trivy/db/metadata.json" >/dev/null
          grype db update
          grype db version

      - name: Scan -> publish (release contract, no signing credentials)
        id: publish
        env:
          GATE_VULNS: 'true'
          GH_TOKEN: ${{ github.token }}   # packages API, for a package not yet created
        run: |
          set -euo pipefail
          ./scripts/cut-registry.sh publish

      - name: Upload scan and SBOM records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-cut-build-${{ github.ref_name }}
          path: dist/registry-cut/**
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Sign and attest ${{ matrix.image.name }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write           # push signatures and attestations to ghcr.io
      id-token: write           # the workflow identity keyless signing uses
      attestations: write       # store the attestations
      artifact-metadata: write  # storage record for each attestation
    strategy:
      fail-fast: true
      matrix:
        image: ${{ fromJSON(needs.build.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        run: |
          TOOLS=cosign ./scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download scan and SBOM records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-cut-build-${{ github.ref_name }}
          path: dist/registry-cut

      - name: Registry login
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login "$REGISTRY" --username "$GH_ACTOR" --password-stdin >/dev/null

      - name: Sign the image digest
        env:
          IMAGE: ${{ matrix.image.repository }}@${{ matrix.image.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Attest SLSA build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.image.repository }}
          subject-digest: ${{ matrix.image.digest }}
          push-to-registry: true

      # Subjects are each index and each platform manifest; an SBOM
      # describes one platform, so the index subjects carry none.
      - name: Attest the SBOM
        if: matrix.image.sbom != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.image.repository }}
          subject-digest: ${{ matrix.image.digest }}
          sbom-path: dist/registry-cut/${{ github.ref_name }}/sbom/${{ matrix.image.sbom }}
          push-to-registry: true

  evidence-suites:
    needs: [packages, build]
    uses: ./.github/workflows/gofips-suites.yml
    with:
      images-artifact: release-image-tars
      packages-artifact: release-packages-{0}

  evidence-capture:
    name: gofips evidence capture
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apko
        run: |
          TOOLS=apko ./scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Capture
        run: providers/gofips/testdata/capture/run.sh "$RUNNER_TEMP/capture" "$RUNNER_TEMP/capture-work"

      - name: Upload the capture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gofips-capture
          path: ${{ runner.temp }}/capture
          if-no-files-found: error
          retention-days: 7

  # One file for the release: the capture, both architectures' suite logs
  # against the shipped provider, and the run's identity, with a checksum
  # list. The bundle is attested (SLSA provenance naming this workflow and
  # commit), so it is verifiable without trusting the repository.
  evidence-bundle:
    name: gofips evidence bundle
    needs: [evidence-suites, evidence-capture]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write           # the workflow identity the attestation names
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gofips-*
          path: evidence

      - name: Pack
        run: |
          set -euo pipefail
          b="gofips-evidence-${DATE}"
          mkdir "$b"
          mv evidence/gofips-capture "$b/capture"
          for a in x86_64 aarch64; do mv "evidence/gofips-suite-logs-$a" "$b/suites-$a"; done
          { echo "release: ${DATE}"
            echo "commit: ${GITHUB_SHA}"
            echo "workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            for a in x86_64 aarch64; do echo "shipped provider ($a):"; sed 's/^/  /' "$b/suites-$a/gofips-shipped.txt"; done
          } > "$b/RELEASE.txt"
          (cd "$b" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "$b.tar.gz" "$b"
          echo "BUNDLE=$b.tar.gz" >> "$GITHUB_ENV"

      - name: Attest the bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.BUNDLE }}

      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-bundle
          path: ${{ env.BUNDLE }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Verify and publish the release
    needs: [build, attest, evidence-bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release and attach the manifest
      packages: write   # read images and attestations; move the latest tag
      id-token: write   # sign the release manifest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign and crane
        run: |
          TOOLS="cosign crane" ./scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download scan and SBOM records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-cut-build-${{ github.ref_name }}
          path: dist/registry-cut

      - name: Registry login
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login "$REGISTRY" --username "$GH_ACTOR" --password-stdin >/dev/null

      - name: Verify every image, advance latest, write the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/cut-registry.sh finalize

      - name: Sign the release manifest
        run: |
          set -euo pipefail
          m="dist/registry-cut/${DATE}/temper-${DATE}.manifest.yaml"
          cosign sign-blob --yes --bundle "${m}.sigstore.json" "$m"

      - name: Download the evidence bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence-bundle
          path: evidence

      - name: Create the release with the manifest and evidence attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          m="dist/registry-cut/${DATE}/temper-${DATE}.manifest.yaml"
          gh release create "$DATE" "$m" "${m}.sigstore.json" "dist/registry-cut/${DATE}/temper-${DATE}.scans.json" \
            evidence/gofips-evidence-"${DATE}".tar.gz \
            --title "Temper ${DATE}" \
            --notes "Images and digests are listed in the attached manifest, and every scanner finding in the scans file, whose sha256 the manifest records. The gofips evidence bundle is attested. See docs/verifying.md."

      - name: Upload release records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-cut-${{ github.ref_name }}
          path: dist/registry-cut/**
          if-no-files-found: error
          retention-days: 90
