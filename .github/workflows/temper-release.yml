---
# temper-release: cut a release when a date tag is pushed: YYYY.MM.DD, or
# YYYY.MM.DD.N for a further release the same day (N = 1, 2, ...).
# The pipeline, and the signing identity consumers verify against, is
# temper-release-build.yml; this file only grants it permissions.
name: temper-release

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[1-9]'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[1-9][0-9]+'

permissions:
  contents: read

# One release at a time: two release jobs running together could each decide
# they are newest and move latest and the line tags backwards. Further tags
# wait in order (queue: max) instead of replacing each other. A run still
# waiting after the day after its date fails the date check and publishes
# nothing: tag today's UTC date instead (with .N if it already has a
# release).
concurrency:
  group: temper-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    uses: ./.github/workflows/temper-release-build.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

  # Rebuild the trust center from the release just published. The token is
  # a GitHub App's that is installed only on MaliSec/trust with Actions
  # access only; its key is in the trust-dispatch environment, which only
  # date tags can deploy from. A failure here leaves the release published.
  notify-trust:
    needs: release
    runs-on: ubuntu-24.04
    environment: trust-dispatch
    permissions: {}
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRUST_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.TRUST_DISPATCH_APP_KEY }}
          owner: MaliSec
          repositories: trust
          permission-actions: write
      - name: Rebuild the trust center
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh workflow run trust-center.yml -R MaliSec/trust
