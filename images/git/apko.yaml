# git: repository-cloning helper. See README.md.
#
# No busybox: the hardening policy fails a runtime image that ships a shell
# outside the shell tier (policy §2), and git's clone/fetch path needs none.
#
# Build (from the repository root):
#   apko lock images/git/apko.yaml --arch x86_64,aarch64 \
#     --output images/git/apko.lock.json
#   apko build images/git/apko.yaml git:local dist/git.tar \
#     --arch x86_64 --lockfile images/git/apko.lock.json
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - git
    - openssh-client

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  # Lets git find its fetch helpers without a login shell.
  GIT_EXEC_PATH: /usr/libexec/git-core

# The caller names the git subcommand in exec form.
entrypoint: {}

archs:
  - x86_64
  - aarch64
