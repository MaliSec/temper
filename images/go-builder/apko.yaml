# go-builder: Go build-stage image. Build only, never a production runtime.
# See README.md.
#
# go-1.26 declares no dependencies, so build-base (the cgo path) and bash
# are listed explicitly.
#
# Build (from the repository root):
#   apko lock images/go-builder/apko.yaml --arch x86_64,aarch64 \
#     --output images/go-builder/apko.lock.json
#   apko build images/go-builder/apko.yaml go-builder:local dist/go-builder.tar \
#     --arch x86_64 --lockfile images/go-builder/apko.lock.json
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - go-1.26
    - build-base
    - bash
    - git
    - wget
    - busybox

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs
  # Never download a different Go; inherited by derived build stages.
  GOTOOLCHAIN: local
  HOME: /home/nonroot

entrypoint: {}

archs:
  - x86_64
  - aarch64
