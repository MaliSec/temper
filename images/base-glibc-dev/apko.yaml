# base-glibc-dev: compiler toolchain and headers for build stages. Not a
# production runtime image. See README.md.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - glibc-dev
    - gcc
    - make
    - linux-headers
    - pkgconf
    - busybox  # configure/make scripts need a shell

entrypoint: {}

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs

archs:
  - x86_64
  - aarch64
