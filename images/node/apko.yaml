# node: distroless Node.js runtime base (glibc tier). See README.md.
#
# nodejs-26, the active LTS line. The Node 24 line is images/node-24.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-baselayout
    - nodejs-26
    # OpenSSL 3, for native modules built against libssl.so.3 (Prisma's engines).
    - openssl-3.6-libssl
    - openssl-3.6-libcrypto
    - glibc
    - glibc-locale-posix
    - libgcc
    - libstdc++
    - ca-certificates-bundle
    - tzdata

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
  run-as: 65532

environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  LANG: C.UTF-8

entrypoint: {}

archs:
  - x86_64
  - aarch64
