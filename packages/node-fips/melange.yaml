# temper-node-fips: makes node:crypto APIs that bypass OpenSSL's provider
# interface throw in the node-fips image. guard.js is preloaded through
# NODE_OPTIONS (set in images/node-fips/apko.yaml).
package:
  name: temper-node-fips
  version: 0.1.0
  epoch: 0
  description: "node-fips: refuse node:crypto APIs computed outside the Go Cryptographic Module"
  copyright:
    - license: Apache-2.0
  target-architecture:
    - x86_64
    - aarch64

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox=1.38.0-r3
      # What the packages above pull in, pinned by scripts/pin-build-env.sh.
      - ca-certificates-bundle=20261020-r1
      - glibc-2.44-locale-posix=2.44-r25
      - glibc-2.44=2.44-r25
      - ld-linux-2.44=2.44-r25
      - libcrypt1-2.44=2.44-r25
      - libgcc=16.2.0-r5
      - libxcrypt=4.5.2-r8
      - wolfi-baselayout=20230201-r31

pipeline:
  - name: Install
    runs: |
      install -Dm644 guard.js "${{targets.destdir}}/usr/lib/node-fips/guard.js"
