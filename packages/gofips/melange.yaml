# temper-gofips: the gofips OpenSSL provider (gofips.so) and its
# gofips-only OpenSSL config, for the -fips images. Built from
# providers/gofips (see source-dir) with Wolfi's Go toolchain, whose
# embedded v1.0.0 module archive is the CMVP #5247 validated module.
package:
  name: temper-gofips
  version: 0.1.0
  epoch: 0
  description: OpenSSL provider backed by the Go Cryptographic Module (CMVP #5247)
  copyright:
    - license: Apache-2.0
  target-architecture:
    - x86_64
    - aarch64
  dependencies:
    runtime:
      - glibc
    # The gofips-only config is also the image's default openssl.cnf, so a
    # process started without OPENSSL_CONF does not load the default
    # provider.
    replaces:
      - openssl-4.0-libcrypto

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    # Pinned: the provider binary is a function of the toolchain, and the
    # -fips lockfiles pin the package's checksum. To bump, edit the versions
    # here, then run ./scripts/pin-build-env.sh and ./scripts/build.sh --lock;
    # the scheduled relock does not change these pins.
    packages:
      - build-base=1-r11
      - busybox=1.38.0-r3
      - go-1.26=1.26.11-r0
      - gcc=16.2.0-r5
      - binutils=2.47-r4
      - glibc-2.44-dev=2.44-r24
      - linux-headers=7.3.5-r0
      - openssl-4.0-dev=4.0.3-r8
      # What the packages above pull in, pinned by scripts/pin-build-env.sh.
      - ca-certificates-bundle=20261020-r1
      - glibc-2.44-locale-posix=2.44-r24
      - glibc-2.44=2.44-r24
      - gmp=6.3.0-r13
      - isl=0.28-r7
      - ld-linux-2.44=2.44-r24
      - libatomic=16.2.0-r5
      - libbrotlicommon1=1.2.1-r4
      - libbrotlidec1=1.2.1-r4
      - libbrotlienc1=1.2.1-r4
      - libcrypt1-2.44=2.44-r24
      - libgcc=16.2.0-r5
      - libgomp=16.2.0-r5
      - libpkgconf8=3.0.11-r1
      - libquadmath=16.2.0-r5
      - libstdc++-dev=16.2.0-r5
      - libstdc++=16.2.0-r5
      - libxcrypt-dev=4.5.2-r8
      - libxcrypt=4.5.2-r8
      - libzstd1=1.6.0-r0
      - make=4.4.1-r16
      - mpc=1.4.1-r4
      - mpfr=4.2.2-r6
      - openssf-compiler-options=20250904-r12
      - openssl-4.0-libcrypto=4.0.3-r8
      - openssl-4.0-libssl=4.0.3-r8
      - openssl-provider-legacy-allowed=4.1.0-r1
      - pkgconf=3.0.11-r1
      - posix-cc-wrappers=2-r11
      - wolfi-baselayout=20230201-r31
      - zlib=1.4-r0
  environment:
    CGO_ENABLED: "1"
    GOFIPS140: v1.0.0
    GOTOOLCHAIN: local
    GOWORK: "off"
    GOFLAGS: -buildvcs=false -trimpath -mod=readonly
    GOPROXY: "off"

pipeline:
  # SP 5247 section 11.1: the build must use the unmodified frozen archive.
  - name: Verify the validated module archive
    runs: |
      zip="$(go env GOROOT)/lib/fips140/v1.0.0-c2097c7c.zip"
      echo "daf3614e0406f67ae6323c902db3f953a1effb199142362a039e7526dfb9368b  $zip" | sha256sum -c -

  - name: Build the provider
    runs: |
      go build -ldflags=-checklinkname=0 -buildmode=c-shared -o gofips.so .
      go version -m gofips.so | awk '$1 == "build" && $2 == "GOFIPS140=v1.0.0-c2097c7c" {found=1} END {exit !found}'
      # The provider gets libcrypto through core callbacks only: a direct
      # libcrypto symbol fails to resolve in hosts that load libcrypto
      # privately (Python's _hashlib).
      if nm -D --undefined-only gofips.so | grep -E ' (EVP|OSSL|OPENSSL|ERR|BN|EC|CRYPTO)_'; then
        echo "gofips.so references libcrypto symbols" >&2; exit 1
      fi

  - name: Install
    runs: |
      install -Dm755 gofips.so "${{targets.destdir}}/usr/lib/ossl-modules/gofips.so"
      install -Dm644 openssl-gofips.cnf "${{targets.destdir}}/etc/ssl/openssl-gofips.cnf"
      install -Dm644 openssl-gofips.cnf "${{targets.destdir}}/etc/ssl/openssl.cnf"
